# Stub model service for the AID modules. The code comes from the ConfigMap stub-model-code, which
# 10-ensure-stub.sh creates from stub.py, so the code and the manifest never drift apart.
# Namespace ai-lab is not matched by any Kyverno policy in this course, but the pod is compliant anyway:
# non-root, no privilege escalation, all capabilities dropped, read-only root filesystem, fixed image tag.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stub-model
  namespace: ai-lab
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stub-model
  namespace: ai-lab
  labels:
    app: stub-model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stub-model
  template:
    metadata:
      labels:
        app: stub-model
    spec:
      serviceAccountName: stub-model
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stub-model
          image: registry.access.redhat.com/ubi9/python-311:1
          command: ["python3", "/app/stub.py"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: code
              mountPath: /app
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: code
          configMap:
            name: stub-model-code
---
apiVersion: v1
kind: Service
metadata:
  name: stub-model
  namespace: ai-lab
spec:
  selector:
    app: stub-model
  ports:
    - port: 8080
      targetPort: 8080
