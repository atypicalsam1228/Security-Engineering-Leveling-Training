apiVersion: v1
kind: Pod
metadata: {name: case-latest, namespace: arc-measure}
spec:
  securityContext: {runAsNonRoot: true}
  containers:
    # Deliberate :latest tag: this case must be rejected by the no-latest rule.
    - {name: app, image: "registry.access.redhat.com/ubi9/ubi-minimal:latest", command: ["sleep", "infinity"], resources: {limits: {memory: 64Mi}}}
