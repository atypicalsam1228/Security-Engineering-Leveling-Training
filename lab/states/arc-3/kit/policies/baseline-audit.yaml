# One policy, three rules, all in Audit mode, scoped to arc-measure. Kyverno 1.19.2 ClusterPolicy spelling (kyverno.io/v1).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: arc-baseline
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: true
  rules:
    - name: run-as-non-root
      match: {any: [{resources: {kinds: [Pod], namespaces: [arc-measure]}}]}
      validate:
        failureAction: Audit
        message: "Pods must set runAsNonRoot to true."
        pattern: {spec: {securityContext: {runAsNonRoot: "true"}}}
    - name: no-latest-tag
      match: {any: [{resources: {kinds: [Pod], namespaces: [arc-measure]}}]}
      validate:
        failureAction: Audit
        message: "The latest tag is not allowed."
        pattern: {spec: {containers: [{image: "!*:latest"}]}}
    - name: require-memory-limit
      match: {any: [{resources: {kinds: [Pod], namespaces: [arc-measure]}}]}
      validate:
        failureAction: Audit
        message: "A memory limit is required."
        pattern: {spec: {containers: [{resources: {limits: {memory: "?*"}}}]}}
