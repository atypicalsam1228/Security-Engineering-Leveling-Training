# The reference answer for the GRC-3 writing exercise (Step 5). The learner opens it only after trying.
# The same text is the tail file the module's check expects (generators/content/grc_3.py, Step 5).
apiVersion: v1
kind: ConfigMap
metadata:
  name: cronjob-reference
  namespace: build
data:
  cronjob-tail.yaml: |2
                  env:
                    - name: EVIDENCE_DIR
                      value: /evidence
                    - name: PATH
                      value: /oc-bin:/opt/app-root/bin:/usr/bin:/bin
                  command: ["/bin/sh", "-c"]
                  args:
                    - curl -sf "$GITEA_URL/$GITEA_USER/evidence-scripts/raw/branch/main/collect_evidence.py" -o /tmp/collect_evidence.py && python3 /tmp/collect_evidence.py
                  volumeMounts:
                    - name: evidence
                      mountPath: /evidence
                    - name: oc-bin
                      mountPath: /oc-bin
              serviceAccountName: evidence-runner
