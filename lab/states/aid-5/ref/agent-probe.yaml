apiVersion: v1
kind: Pod
metadata:
  name: agent-probe
  namespace: agents
spec:
  serviceAccountName: agent-runner
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: registry.access.redhat.com/ubi9/python-311:1
      command: ["sleep", "infinity"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
